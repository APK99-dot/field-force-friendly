name: Build Android APK

# Manual trigger only — this does not run on push. Actions tab -> Build Android
# APK -> Run workflow, then download the artifact when it finishes.
#
# Produces an UNSIGNED debug APK. It installs fine by sideloading, but is not
# signed for Play Store distribution. A release build needs a keystore stored in
# repository secrets.
#
# Note: the app's capacitor.config.ts sets server.url to the published site, so
# the APK is a thin WebView shell. Web changes reach installed devices without a
# rebuild — you only need a new APK for new installs, native/plugin changes, or
# to bump RELEASE_TOKEN and bust the WebView asset cache.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: false
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # package-lock.json can drift from package.json because the project is
      # normally built with bun. Fall back rather than failing the run.
      - name: Install dependencies
        run: npm ci || npm install

      # @capacitor/cli is not a project dependency, so add it explicitly instead
      # of relying on npx resolving a floating version at runtime.
      - name: Install Capacitor CLI
        run: npm install --no-save @capacitor/cli@^8

      - name: Build web assets
        run: npm run build

      # The android/ project is not committed, so generate it. Guarded so the
      # workflow still works if it is committed later.
      - name: Add Android platform
        run: |
          if [ -d android ]; then
            echo "android/ already present, skipping cap add"
          else
            npx cap add android
          fi

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name "*.apk" -path "*outputs*" | head -1)
          if [ -z "$APK" ]; then
            echo "No APK produced" >&2
            find android -name "*.apk" >&2 || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bharath-builders-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
